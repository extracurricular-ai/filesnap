name: release

# Tag-driven, so what gets published is a commit that exists and is named.
# `workflow_dispatch` is the rehearsal: with `dry_run` left on it does
# everything except the upload, which is one of only two safety nets there
# are — **a published version can never be replaced or reused**, and `yank`
# hides rather than deletes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Rehearse without uploading"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Nothing is published until the same suite CI runs has passed on the exact
  # commit being released. CI runs on `main`, and a tag can point anywhere.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features filesnap/test-support

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Must match the "Environment name" configured on crates.io for both
    # crates. Its value here is that a protection rule on the environment —
    # a required reviewer — stops a publish even if something unwanted has
    # reached the tag.
    environment: crates-io
    permissions:
      # **A job-level `permissions:` block replaces the workflow-level one
      # rather than merging with it**, so `contents: read` has to be restated
      # here. Without it `actions/checkout` fails.
      contents: read
      # What the OIDC exchange needs. This is the whole reason there is no
      # long-lived registry token in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A tag that does not name the version in the manifest would publish
      # something nobody asked for, and there is no taking it back. Checked
      # before anything is uploaded rather than discovered afterwards.
      - name: The tag and the manifest agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          echo "manifest=$manifest tag=$tag"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $manifest"
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # A rehearsal cannot go crate by crate, which is why it is one step
      # rather than a flag threaded through the two below. `cargo publish -p
      # filesnap-cli --dry-run` resolves `filesnap` from the registry, and in
      # a rehearsal the engine's new version exists only locally — so the CLI
      # would fail on the version the real run publishes one step earlier.
      - name: Rehearse
        if: inputs.dry_run
        run: cargo publish --workspace --dry-run

      # Published in dependency order: `filesnap-cli` depends on `filesnap`,
      # and cargo resolves that from the registry, so the engine has to be
      # there first. `cargo publish` waits for the index to catch up before
      # it returns, so no sleep is needed between the two.
      #
      # Each step skips a version that is already on the registry rather than
      # failing on it. That is what makes this **resumable**: if the engine
      # lands and the CLI fails, re-running must not be blocked by the half
      # that already succeeded — and with no rollback, being unable to
      # re-run is how a release ends up finished by hand.
      - name: Publish filesnap
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/publish.sh filesnap

      - name: Publish filesnap-cli
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: .github/publish.sh filesnap-cli

  # Six native runners, plain `cargo build --target`. No `cross`, no zigbuild,
  # no musl-tools: this dependency graph has no C in it at all — gix 0.81
  # resolves compression to the pure-Rust `zlib-rs`, and nothing else in the
  # lockfile carries a `links` key. That is what makes the musl targets free.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is musl on purpose. A glibc build inherits a symbol-version
          # floor from whatever runner produced it, which breaks older distros
          # and containers — the one failure an npm-installed binary cannot
          # help its user debug. Static musl costs nothing here; it measured
          # 58 KB *smaller* than the glibc build.
          - slug: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - slug: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # macos-15 is arm64; the Xcode SDK carries both slices, so the x64
          # cell needs no extra tooling beyond the target.
          - slug: darwin-x64
            os: macos-15
            target: x86_64-apple-darwin
          - slug: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - slug: win32-x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - slug: win32-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `rust-toolchain.toml` is a rustup *file override* and beats whatever
      # the action installed, so the target has to land on the pinned
      # toolchain rather than a floating stable. Printed, because the failure
      # is otherwise a linker error three steps later.
      - name: Add the target to the toolchain that will build
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      # Stripped for distribution only, through the environment rather than
      # `[profile.release]` in the manifest — a `cargo install filesnap-cli`
      # user should keep their symbol table, because a panic backtrace made of
      # bare addresses is not something they can report. The release profile
      # carries no debug info to begin with, so this is the symbol table and
      # it is worth about 30% of the download.
      - run: cargo build --release --locked -p filesnap-cli --target ${{ matrix.target }}
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols

      - name: Stage the binary under its triple
        shell: bash
        run: |
          set -euo pipefail
          exe=filesnap
          [ "${{ runner.os }}" = "Windows" ] && exe=filesnap.exe
          mkdir -p "vendor/${{ matrix.target }}/bin"
          cp "target/${{ matrix.target }}/release/$exe" "vendor/${{ matrix.target }}/bin/$exe"

      - uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.slug }}
          path: vendor/
          # One binary; compressing an already-compressed ELF buys nothing and
          # costs a minute across six jobs.
          compression-level: 0
          if-no-files-found: error

  npm:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      # Restated, because a job-level block replaces the workflow-level one
      # rather than merging with it.
      contents: read
      # npm trusted publishing authenticates this job by the OIDC token GitHub
      # mints for it. The claim registered on npmjs.com names this workflow by
      # **filename** — moving this job into another file revokes publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Deliberately no `registry-url`. It writes `_authToken=${NODE_AUTH_TOKEN}`
          # into .npmrc; with no token that is an empty credential which npm
          # still sends, so the registry rejects it instead of npm falling back
          # to the OIDC exchange.

      # Node 22 ships npm 10.x, and trusted publishing needs 11.5.1 or later.
      # Pinned to a major rather than `@latest`: npm 12 changed
      # `npm pack --json` from a list to an object keyed by package name, and
      # a release should not be the thing that discovers what npm shipped this
      # morning.
      - run: npm install -g "npm@^11.5.1"

      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-*
          merge-multiple: true
          path: vendor

      - name: The tag and the manifest agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name version $manifest"
            exit 1
          fi

      # The very first publish of a name cannot use OIDC: a trusted publisher
      # is configured on the package's settings page, and that page does not
      # exist until the package does. Set `NPM_TOKEN` for that one release and
      # delete it afterwards — with the secret absent this writes nothing and
      # the OIDC path is used.
      - name: Bootstrap credential, if one was provided
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
            echo "::warning::publishing with a token; remove the NPM_TOKEN secret once trusted publishing is configured"
          else
            echo "no NPM_TOKEN — using trusted publishing over OIDC"
          fi

      - name: Publish
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          npm --version

          # Already on the registry? Then this is a re-run of a release whose
          # earlier half landed, and there is nothing to do for this one.
          #
          # **Without this the npm half cannot be re-run at all.** An npm
          # version can never be reused, so a failure at the fourth package
          # leaves three published — and every retry then dies on the first,
          # under `set -e`, with the remaining four still missing and no way
          # out but hand-editing this file. `.github/publish.sh` has carried
          # the same guard for crates.io since the first release; this half
          # went without it because the one failure we had happened to land
          # before anything was published, which proves nothing about the
          # next one.
          #
          # Positive confirmation only. `|| true` on the curl, and a match on
          # the version rather than on the not-found sentinel: an unreachable
          # registry must fall through to the publish, which then fails
          # loudly and correctly if the version really is there. Reading a
          # network failure as "already published" would silently skip a
          # package that was never uploaded.
          published() {  # <version>
            local version="$1"
            curl -sS --max-time 30 -A "filesnap-release" \
              "https://registry.npmjs.org/filesnap/${version}" 2>/dev/null \
              | grep -q "\"version\":\"${version}\"" || return 1
          }

          publish() {  # <version> <tarball> [dist-tag]
            local version="$1" tarball="$2" tag="${3:-}"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              # No skip in a rehearsal: packing and validating is the whole
              # point of one, and it is what the published check would rob it
              # of on a re-rehearsed version.
              npm publish "$tarball" --dry-run ${tag:+--tag "$tag"}
            elif published "$version"; then
              echo "    filesnap@${version} is already on the registry — nothing to do"
            else
              npm publish "$tarball" ${tag:+--tag "$tag"}
            fi
          }

          # Platforms first, launcher last. The launcher's aliases pin exact
          # versions, so they must all resolve the moment it lands — a
          # launcher published first is a `latest` that cannot install.
          #
          # Each platform build is kept off `latest` by its own dist-tag,
          # because `latest` is what a bare `npm install filesnap` follows:
          # point it at one platform and every other platform gets a package
          # with no binary it can run. The version suffix is a second belt —
          # `0.2.0-linux-x64` is a semver prerelease, which sorts below 0.2.0
          # and is excluded from ranges by default.
          for slug in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            tarball=$(node npm/build.mjs --package "filesnap-$slug" --version "$version" --vendor-src vendor)
            publish "$version-$slug" "$tarball" "$slug"
          done

          tarball=$(node npm/build.mjs --package filesnap --version "$version")
          publish "$version" "$tarball"
