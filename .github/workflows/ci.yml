name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the things this catches do not arrive with a commit: a new
  # clippy lint, a dependency that raised its own MSRV, a runner image change.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A backtrace costs nothing here and is the difference between a useful
  # failure and a second run to reproduce it.
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting and lints once, on the cheapest runner. They are
  # platform-independent, so running them three times would only slow the
  # matrix down.
  lint:
    runs-on: ubuntu-latest
    # A hung test must cost a red X, not the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No toolchain action: `rust-toolchain.toml` pins the version and lists
      # the components, and a rustup *file override* beats `rustup default`
      # anyway — so installing one here would say "stable" and run 1.95.
      # The pin is the single source, which is what a pin is for.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `--all-targets` so tests and examples are linted too. The workspace
      # denies a long list of lints; this is where that list is enforced.
      - run: cargo clippy --workspace --all-targets --features filesnap/test-support -- -D warnings

  test:
    strategy:
      # Do not cancel the other platforms when one fails. The whole point of
      # this matrix is that the failures differ, and seeing one of them is
      # worth less than seeing all three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must cost a red X, not the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # See the lint job: `rust-toolchain.toml` governs.
      - uses: Swatinem/rust-cache@v2
      # `git` is read for the tracked-file partition, and a test fixture
      # shells out to it. Present on every runner image, asserted so a
      # missing one fails here rather than inside a test.
      - run: git --version
      - run: cargo test --workspace --features filesnap/test-support

  # The declared MSRV, actually checked. Without this the `rust-version` field
  # is a claim nothing holds up: it was derived by reading stabilization
  # versions, and a dependency can raise its own floor without us noticing.
  #
  # `cargo check` rather than `cargo test`: the dev-dependencies are free to
  # need something newer, and holding them to the MSRV would be a promise we
  # never made to consumers.
  msrv:
    runs-on: ubuntu-latest
    # A hung test must cost a red X, not the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # `RUSTUP_TOOLCHAIN`, not the installed default. `rust-toolchain.toml`
      # is a rustup *file override*, and a file override beats
      # `rustup default` — which is all the action above sets. Without this
      # the job installed the MSRV toolchain, then silently downloaded the
      # pinned one and compiled with that instead: a job that could not fail,
      # holding up nothing, which is the exact shape of defect this whole
      # audit kept finding.
      #
      # Verified locally: `1.89.0` builds the workspace, and with the declared
      # version lowered to 1.88 the build fails on `std::fs::TryLockError`
      # being unstable — so 1.89 is the measured floor, not a derived one.
      - run: cargo check --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  # What a consumer actually receives. `cargo test` in the workspace says
  # nothing about whether the *packaged* crate is coherent — the engine's
  # integration tests are deliberately excluded from it, and a file left out
  # by accident would only surface here.
  # The npm launcher and its generator, executed. Nothing in the cargo matrix
  # reads a JavaScript file, so without this job the wrapper's exit-code
  # propagation, the two triple tables and every field of a generated manifest
  # first run during a release — the one place a mistake is not a red build but
  # a burned version number, because a published version can never be replaced.
  #
  # Three platforms because the binary name and the symlink privilege differ.
  # Files named explicitly: `node --test <directory>` is a MODULE_NOT_FOUND on
  # node 24.
  #
  # The lone node 18 cell is the floor `npm/package.json` declares in
  # `engines`, held on one platform rather than three. It is not decoration:
  # node 18 refuses to parse an ES module named `.js`, while 22 and later
  # retry it as one — so a coupling that is fatal on the version we claim to
  # support is invisible on the version we develop against. That is exactly
  # how the launcher shipped depending on `"type": "module"` in a sibling
  # manifest. Delete this cell only together with the `>=18` claim.
  npm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "18"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test npm/test/launcher.test.mjs npm/test/build.test.mjs

  package:
    runs-on: ubuntu-latest
    # A hung test must cost a red X, not the 360-minute default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # See the lint job: `rust-toolchain.toml` governs.
      - uses: Swatinem/rust-cache@v2
      # `--workspace`, not `-p` twice. `cargo package -p filesnap-cli`
      # resolves `filesnap` from the registry, so on any commit that bumps
      # the version it fails on an engine that has not been published yet —
      # every release would turn CI red on the way out. `--workspace`
      # resolves the dependency from the workspace and verifies both.
      - run: cargo package --workspace
      - name: The packaged engine builds and tests on its own
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          # `filesnap-*` also matches `filesnap-cli-*`, which made tar fail
          # on the second archive. The digit anchors it to the engine.
          tar xzf target/package/filesnap-[0-9]*.crate -C "$dir"
          cd "$dir"/filesnap-[0-9]*
          cargo test
