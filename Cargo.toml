[workspace]
members = ["crates/*"]
# Edition 2024's own default, stated because the difference matters: resolver
# 3 is resolver 2 plus **MSRV-aware version selection**, so cargo will not pick
# a dependency release that requires a newer rustc than `rust-version` allows.
# Written as "2" this opted back out, and the lockfile shows what that costs —
# it pinned `kstring 2.0.4`, which declares rust-version 1.96, above both our
# floor and the toolchain pin. It builds today only because nothing activates
# the gix feature that pulls it.
resolver = "3"

[workspace.package]
version = "0.1.0"
# Track the edition for all workspace crates in one place.
edition = "2024"
# The oldest toolchain that builds this. Set by `std::fs::TryLockError`, which
# the session lock uses and which stabilized in 1.89 — everything else the
# crates reach for is older (`StaleNetworkFileHandle` 1.83, edition 2024 1.85,
# if-let chains 1.88).
#
# Declared rather than left implicit so a user on an older toolchain is told
# which version they need, instead of a compile error inside a private module.
rust-version = "1.89"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
gix = { version = "0.81.0", default-features = false, features = ["sha1"] }
ignore = "0.4.23"
pretty_assertions = "1.4.1"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.44"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.dev]
# Keep line tables/backtraces while avoiding expensive full variable debug info.
debug = "limited"
