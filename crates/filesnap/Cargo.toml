[package]
name = "filesnap"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
description = "Git-free file snapshots and rewind: a content-addressed store that puts a directory back the way it was, without a repository and without touching the user's version control."
repository = "https://github.com/extracurricular-ai/filesnap"
keywords = ["snapshot", "rewind", "undo", "checkpoint", "restore"]
categories = ["filesystem", "development-tools"]

[features]
# Test fixtures, shared between this crate's own tests and its integration
# tests so there is one place to build a realistic store (D36).
test-support = ["dep:tempfile"]

[lints]
workspace = true

[dependencies]
# `index` reads the repository index directly, which is what the git-tracked
# partition needs; the workspace default turns every optional feature off.
gix = { workspace = true, features = ["index"] }
ignore = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
filesnap = { path = ".", features = ["test-support"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lib]
doctest = false
